<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Percentage Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-elements">
        <div class="heart shape-1"></div>
        <div class="heart shape-2"></div>
        <div class="heart shape-3"></div>
        <div class="heart shape-4"></div>
    </div>

    <div class="container">
        <div class="card">
            <h1>Love Calculator 💖</h1>
            <p class="subtitle">Enter two names to see your true connection</p>

            <div class="input-group">
                <input type="text" id="name1" placeholder="Name1" autocomplete="off">
                <span class="plus">+</span>
                <input type="text" id="name2" placeholder="Name2" autocomplete="off">
            </div>

            <button id="calculate-btn">Calculate Percentage</button>

            <div id="result-section" class="hidden">
                <h3>Calculation Steps:</h3>
                <div id="steps-container"></div>

                <div class="final-result hidden" id="final-result">
                    <svg class="progress-ring" width="140" height="140">
                        <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.2)" stroke-width="10"
                            fill="transparent" r="60" cx="70" cy="70" />
                        <circle class="progress-ring__circle" stroke="#ff4d4d" stroke-width="10" stroke-linecap="round"
                            fill="transparent" r="60" cx="70" cy="70" />
                    </svg>
                    <div class="percentage-text"><span id="percentage">0</span>%</div>
                </div>
                <p id="message"></p>
            </div>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>

</html>
